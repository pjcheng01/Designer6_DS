[PRINT_DEF] 出圖設定（HP-K.LSP）
裝置與紙張名稱必須與 DraftSight 的 -PRINT 按 ? 列出的字串逐字相同。
取得方式：命令列打 -PRINT，進階列印選項答 Y，圖頁名稱答 Model，
在「指定印表機名稱」按 ? 看裝置清單，填入裝置後在「指定紙張大小」按 ?
看該裝置的紙張清單。紙張清單是驅動專屬的，不同機器不一樣。

